# รันทั้ง API และ SQL Server สำหรับพัฒนา:
#   cp .env.example .env   (แก้รหัสผ่าน)    →   docker compose --profile db up --build
# ถ้ามี SQL Server ของทีมอยู่แล้ว ให้ตั้ง DB_HOST ใน .env แล้วรันเฉพาะ api:  docker compose up --build api
#
# หมายเหตุ: container ฐานข้อมูลนี้ "ว่าง" — ต้องสร้าง CMS_DB / BUI_RG จากสคริปต์ DDL ของทีม DBA เอง
# (repo นี้ไม่รันสคริปต์ DDL ให้ และ API ปิด synchronize ไว้เสมอ)
services:
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      STORAGE_ROOT: /data
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - dms-data:/data
    restart: unless-stopped

  db:
    profiles: ['db']
    image: mcr.microsoft.com/mssql/server:2022-latest   # Apple Silicon: ใช้ mcr.microsoft.com/azure-sql-edge หรือรัน x86 emulation
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?ตั้ง DB_PASSWORD ใน .env (ต้องมีตัวพิมพ์เล็ก/ใหญ่ ตัวเลข สัญลักษณ์ ≥ 8 ตัว)}
      TZ: Asia/Bangkok
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  dms-data:
  mssql-data:
